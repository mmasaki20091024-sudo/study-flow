<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>study-flow</title>
<style>
:root {
  --bg: #0a0a0a;
  --card: #161616;
  --card2: #1c1c1c;
  --ink: #f2f2f2;
  --muted: #8a8a8a;
  --line: #2a2a2a;
  --accent: #e8e4d9;
  --accent-text: #1a1a1a;
  --green: #6b9b7a;
  --red: #c45c5c;
  --radius: 18px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  padding: 12px 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid transparent;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #1f1f1f;
  border: none;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.btn-icon svg { width: 16px; height: 16px; }
.app-name {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--muted);
}
.header-center {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  flex: 1;
}
.header-right { width: 36px; } /* spacer */

/* ===== Main content ===== */
.main {
  padding: 8px 16px 110px;
  max-width: 520px;
  margin: 0 auto;
  min-height: calc(100vh - 120px);
}
.view { display: none; }
.view.active { display: block; animation: fadeIn .22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-title {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 8px 0 18px;
  color: var(--ink);
}
.section-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.65;
  margin-bottom: 22px;
}

/* ===== Cards ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-bottom: 12px;
}
.card-soft {
  background: var(--card2);
  border-radius: 14px;
  padding: 16px;
}

/* ===== Empty states ===== */
.empty-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
}
.empty-card h3 {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 8px;
}
.empty-card p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 18px;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  font-family: inherit;
}
.btn:active { transform: scale(0.97); opacity: 0.85; }
.btn-primary {
  background: var(--accent);
  color: var(--accent-text);
  padding: 12px 20px;
}
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 11px 16px;
  width: 100%;
  border-radius: 14px;
  margin-bottom: 8px;
}
.btn-ghost:last-child { margin-bottom: 0; }
.btn-text {
  background: transparent;
  color: var(--muted);
  padding: 10px;
  font-size: 13px;
  width: 100%;
  text-align: center;
}
.btn-full { width: 100%; }

/* ===== Form ===== */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
.field input, .field select {
  width: 100%;
  background: #111;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--ink);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
}
.field input:focus, .field select:focus {
  border-color: #555;
}
.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ===== Goal list ===== */
.goal-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.goal-item .info { flex: 1; min-width: 0; }
.goal-item .name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}
.goal-item .meta {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.goal-item .del {
  background: transparent;
  border: none;
  color: var(--red);
  font-size: 12px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}

/* ===== Today stats ===== */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}
.stat-box small {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}
.stat-box b {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* ===== Day plan ===== */
.day-block {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 12px;
}
.day-head {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.day-head b { font-size: 14px; font-weight: 600; }
.day-head span { font-size: 12px; color: var(--muted); }
.plan-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.plan-item:last-child { border-bottom: none; }
.plan-item .top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.plan-item input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin-top: 2px;
  accent-color: var(--green);
  flex-shrink: 0;
}
.plan-item .text { flex: 1; }
.plan-item strong {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 3px;
}
.plan-item small {
  font-size: 12px;
  color: var(--muted);
}
.plan-item.done strong {
  text-decoration: line-through;
  color: var(--muted);
}
.plan-empty {
  padding: 20px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
.progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding-left: 32px;
}
.progress-row input {
  width: 80px;
  background: #111;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  text-align: center;
}
.progress-row input:focus { border-color: #555; }
.progress-row .unit-label {
  font-size: 13px;
  color: var(--muted);
  min-width: 28px;
}
.progress-row .btn-record {
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.progress-row .btn-record:active { opacity: 0.85; }

/* ===== Schedule (予定) ===== */
.week-summary {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}
.week-summary .status {
  color: var(--muted);
  font-weight: 500;
}
.action-list { margin-bottom: 28px; }

.day-section-label {
  font-size: 12px;
  color: var(--muted);
  margin: 20px 0 10px;
  font-weight: 500;
}
.day-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
}
.day-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.day-card-head .day-name {
  font-size: 16px;
  font-weight: 600;
}
.day-card-head .status {
  font-size: 13px;
  color: var(--muted);
}
.day-card .no-slot {
  font-size: 13px;
  color: var(--muted);
  margin: 8px 0 12px;
}
.slot-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  align-items: end;
  margin-bottom: 10px;
}
.slot-row .field { margin-bottom: 0; }
.slot-row .field label { font-size: 11px; }
.slot-row input {
  padding: 10px 12px;
  font-size: 14px;
}
.btn-remove-slot {
  background: transparent;
  border: none;
  color: var(--red);
  font-size: 18px;
  padding: 8px;
  cursor: pointer;
  line-height: 1;
}
.btn-add-slot {
  width: 100%;
  background: #222;
  border: 1px dashed #3a3a3a;
  color: var(--muted);
  border-radius: 12px;
  padding: 11px;
  font-size: 13px;
  cursor: pointer;
  margin-top: 4px;
}
.total-hours-badge {
  display: inline-block;
  background: #1f2a1f;
  color: var(--green);
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  margin-top: 4px;
}

/* ===== Notice / warning ===== */
.notice {
  background: #1f1a12;
  border: 1px solid #3a3220;
  color: #c9a86c;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 12px;
  line-height: 1.55;
  margin-bottom: 12px;
}

/* ===== Bottom Tab Bar ===== */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0f0f0f;
  border-top: 1px solid #1e1e1e;
  display: flex;
  justify-content: space-around;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  z-index: 100;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: #555;
  font-size: 10px;
  font-weight: 500;
  cursor: pointer;
  padding: 6px 0;
  font-family: inherit;
}
.tab.active { color: var(--ink); }
.tab svg {
  width: 22px;
  height: 22px;
  stroke-width: 1.6;
}
.tab.active svg { stroke-width: 2; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #141414;
  width: 100%;
  max-width: 520px;
  border-radius: 22px 22px 0 0;
  padding: 24px 20px calc(28px + var(--safe-bottom));
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp .28s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal h2 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 18px;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.modal-actions .btn { flex: 1; padding: 14px; }

/* ===== Utilities ===== */
.hidden { display: none !important; }
.text-muted { color: var(--muted); }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <button class="btn-icon" onclick="confirmReset()" aria-label="リセット">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <span class="app-name">study-flow</span>
  </div>
  <div class="header-center" id="headerDate"></div>
  <div class="header-right"></div>
</header>

<main class="main">

  <!-- ===== 今日 ===== -->
  <section class="view active" id="view-today">
    <h1 class="page-title">今日やる分</h1>

    <div id="todayContent">
      <!-- filled by JS -->
    </div>
  </section>

  <!-- ===== 目標 ===== -->
  <section class="view" id="view-goals">
    <h1 class="page-title">目標</h1>
    <p class="section-desc">期限と、残っている量。終わった分は今日の画面から記録できます。</p>

    <div id="goalsList"></div>

    <button class="btn btn-primary btn-full mt-16" onclick="openGoalModal()">＋ 目標を追加</button>
  </section>

  <!-- ===== 予定 ===== -->
  <section class="view" id="view-schedule">
    <h1 class="page-title">勉強できる時間</h1>
    <p class="section-desc">曜日ごとの、勉強できる時間。ノルマは期限までの空きの割合で割るので、長い日は多く、短い日は少なくなります。</p>

    <div class="week-summary" id="weekSummary">1週間の空き <span class="status">未設定</span></div>

    <div class="action-list">
      <button class="btn btn-ghost" onclick="copyWeekday()">平日を月曜に揃える</button>
      <button class="btn btn-ghost" onclick="copyWeekend()">休日を土曜に揃える</button>
      <button class="btn btn-ghost" onclick="fillExample()">例を入れる</button>
      <button class="btn btn-text" onclick="clearAllSlots()">全部消す</button>
    </div>

    <div class="day-section-label">平日</div>
    <div id="weekdayList"></div>

    <div class="day-section-label">休日</div>
    <div id="weekendList"></div>
  </section>

</main>

<!-- Bottom Tab Bar -->
<nav class="tabbar">
  <button class="tab active" data-view="today" onclick="switchTab('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    今日
  </button>
  <button class="tab" data-view="goals" onclick="switchTab('goals')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    目標
  </button>
  <button class="tab" data-view="schedule" onclick="switchTab('schedule')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    予定
  </button>
</nav>

<!-- Goal Modal -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <h2 id="modalTitle">目標を追加</h2>
    <div class="field">
      <label>目標名</label>
      <input id="g-name" placeholder="例：英単語2000語" autocomplete="off">
    </div>
    <div class="row-2">
      <div class="field">
        <label>締め切り</label>
        <input id="g-deadline" type="date">
      </div>
      <div class="field">
        <label>優先度</label>
        <select id="g-priority">
          <option value="1">通常</option>
          <option value="1.25">高い</option>
          <option value="1.5">最優先</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label>全体の量</label>
        <input id="g-total" type="number" min="1" placeholder="例：2000" inputmode="numeric">
      </div>
      <div class="field">
        <label>単位</label>
        <input id="g-unit" placeholder="語 / 問 / ページ">
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label>完了した量</label>
        <input id="g-completed" type="number" min="0" value="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>1単位あたり（分）</label>
        <input id="g-minutes" type="number" min="1" value="5" inputmode="numeric">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="margin:0" onclick="closeGoalModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveGoal()">保存</button>
    </div>
  </div>
</div>

<script>
const dayNames = ['日曜','月曜','火曜','水曜','木曜','金曜','土曜'];
const dayNamesFull = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];

let tasks = [];
let schedule = Array.from({length:7}, () => []); // array of {start, end} per day
let editingId = null;

const $ = id => document.getElementById(id);

/* ===== Init ===== */
function init() {
  updateHeaderDate();
  loadData();
  renderSchedule();
  renderGoals();
  renderToday();
}

function updateHeaderDate() {
  const now = new Date();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const w = '日月火水木金土'[now.getDay()];
  $('headerDate').textContent = `${m}月${d}日（${w}）`;
}

/* ===== Tab ===== */
function switchTab(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  $(`view-${name}`).classList.add('active');
  document.querySelector(`.tab[data-view="${name}"]`).classList.add('active');
  if (name === 'today') renderToday();
  if (name === 'goals') renderGoals();
  if (name === 'schedule') renderSchedule();
}

/* ===== Goals ===== */
function openGoalModal(id = null) {
  editingId = id;
  $('modalTitle').textContent = id ? '目標を編集' : '目標を追加';
  if (id) {
    const t = tasks.find(x => String(x.id) === String(id));
    if (!t) return;
    $('g-name').value = t.name;
    $('g-deadline').value = t.deadline;
    $('g-priority').value = t.priority;
    $('g-total').value = t.total;
    $('g-unit').value = t.unit;
    $('g-completed').value = t.completed;
    $('g-minutes').value = t.minutes;
  } else {
    $('g-name').value = '';
    $('g-deadline').value = '';
    $('g-priority').value = '1';
    $('g-total').value = '';
    $('g-unit').value = '';
    $('g-completed').value = '0';
    $('g-minutes').value = '5';
  }
  $('goalModal').classList.add('show');
}

function closeGoalModal() {
  $('goalModal').classList.remove('show');
  editingId = null;
}

function saveGoal() {
  const name = $('g-name').value.trim();
  const deadline = $('g-deadline').value;
  const total = Number($('g-total').value);
  const unit = $('g-unit').value.trim() || '個';
  const completed = Number($('g-completed').value || 0);
  const minutes = Number($('g-minutes').value);
  const priority = Number($('g-priority').value);

  if (!name || !deadline || !total || total < 1 || !minutes || completed < 0 || completed > total) {
    alert('目標名・締め切り・全体の量・所要時間を正しく入力してください。');
    return;
  }
  if (new Date(deadline + 'T23:59:00') < new Date(new Date().toDateString())) {
    alert('締め切りは今日以降に設定してください。');
    return;
  }

  if (editingId) {
    const t = tasks.find(x => String(x.id) === String(editingId));
    if (t) {
      Object.assign(t, { name, deadline, total, unit, completed, minutes, priority });
    }
  } else {
    tasks.push({
      id: Date.now() + Math.random(),
      name, deadline, total, unit, completed, minutes, priority
    });
  }
  closeGoalModal();
  saveData();
  renderGoals();
  renderToday();
}

function removeGoal(id) {
  if (!confirm('この目標を削除しますか？')) return;
  tasks = tasks.filter(t => String(t.id) !== String(id));
  saveData();
  renderGoals();
  renderToday();
}

function renderGoals() {
  const list = $('goalsList');
  if (!tasks.length) {
    list.innerHTML = `
      <div class="empty-card">
        <h3>最初の目標</h3>
        <p>たとえば、12月20日までに英単語2000語。</p>
        <button class="btn btn-primary" onclick="openGoalModal()">目標を追加</button>
      </div>`;
    return;
  }
  list.innerHTML = tasks.map(t => {
    const remain = Math.max(0, t.total - t.completed);
    const hours = Math.round(remain * t.minutes / 60 * 10) / 10;
    return `
      <div class="goal-item">
        <div class="info" onclick="openGoalModal('${t.id}')" style="cursor:pointer">
          <div class="name">${esc(t.name)}</div>
          <div class="meta">期限 ${t.deadline} · 残り ${remain}${esc(t.unit)} · 約${hours}時間</div>
        </div>
        <button class="del" onclick="removeGoal('${t.id}')">削除</button>
      </div>`;
  }).join('');
}

/* ===== Schedule ===== */
function getDayHours(dayIndex) {
  return schedule[dayIndex].reduce((sum, s) => {
    const [sh, sm] = s.start.split(':').map(Number);
    const [eh, em] = s.end.split(':').map(Number);
    let mins = (eh * 60 + em) - (sh * 60 + sm);
    if (mins < 0) mins += 24 * 60;
    return sum + Math.max(0, mins) / 60;
  }, 0);
}

function getWeekTotalHours() {
  return schedule.reduce((sum, _, i) => sum + getDayHours(i), 0);
}

function renderSchedule() {
  const total = getWeekTotalHours();
  $('weekSummary').innerHTML = total > 0
    ? `1週間の空き <span style="color:var(--ink)">${total.toFixed(1)}時間</span>`
    : `1週間の空き <span class="status">未設定</span>`;

  const weekdays = [1,2,3,4,5];
  const weekend = [6,0];

  $('weekdayList').innerHTML = weekdays.map(i => renderDayCard(i)).join('');
  $('weekendList').innerHTML = weekend.map(i => renderDayCard(i)).join('');
}

function renderDayCard(i) {
  const hours = getDayHours(i);
  const slots = schedule[i];
  const status = hours > 0 ? `${hours.toFixed(1)}時間` : '勉強しない';

  let slotsHtml = '';
  if (slots.length === 0) {
    slotsHtml = `<div class="no-slot">この曜日は空きがありません。</div>`;
  } else {
    slotsHtml = slots.map((s, si) => `
      <div class="slot-row">
        <div class="field">
          <label>開始</label>
          <input type="time" value="${s.start}" onchange="updateSlot(${i},${si},'start',this.value)">
        </div>
        <div class="field">
          <label>終了</label>
          <input type="time" value="${s.end}" onchange="updateSlot(${i},${si},'end',this.value)">
        </div>
        <button class="btn-remove-slot" onclick="removeSlot(${i},${si})" aria-label="削除">×</button>
      </div>
    `).join('');
  }

  return `
    <div class="day-card">
      <div class="day-card-head">
        <span class="day-name">${dayNames[i]}</span>
        <span class="status">${status}</span>
      </div>
      ${slotsHtml}
      <button class="btn-add-slot" onclick="addSlot(${i})">枠を追加</button>
    </div>`;
}

function addSlot(dayIndex) {
  const defaults = {
    0: {start:'09:00', end:'12:00'},
    1: {start:'17:00', end:'20:00'},
    2: {start:'17:00', end:'20:00'},
    3: {start:'17:00', end:'20:00'},
    4: {start:'17:00', end:'20:00'},
    5: {start:'17:00', end:'20:00'},
    6: {start:'09:00', end:'12:00'}
  };
  schedule[dayIndex].push({ ...defaults[dayIndex] });
  saveData();
  renderSchedule();
  renderToday();
}

function removeSlot(dayIndex, slotIndex) {
  schedule[dayIndex].splice(slotIndex, 1);
  saveData();
  renderSchedule();
  renderToday();
}

function updateSlot(dayIndex, slotIndex, key, value) {
  schedule[dayIndex][slotIndex][key] = value;
  saveData();
  renderSchedule();
  renderToday();
}

function copyWeekday() {
  const src = schedule[1].map(s => ({...s}));
  [2,3,4,5].forEach(i => { schedule[i] = src.map(s => ({...s})); });
  saveData();
  renderSchedule();
  renderToday();
}

function copyWeekend() {
  const src = schedule[6].map(s => ({...s}));
  schedule[0] = src.map(s => ({...s}));
  saveData();
  renderSchedule();
  renderToday();
}

function fillExample() {
  schedule = [
    [{start:'09:00', end:'12:00'}, {start:'14:00', end:'17:00'}], // Sun
    [{start:'17:00', end:'21:00'}], // Mon
    [{start:'17:00', end:'21:00'}],
    [{start:'17:00', end:'21:00'}],
    [{start:'17:00', end:'21:00'}],
    [{start:'17:00', end:'21:00'}],
    [{start:'09:00', end:'12:00'}, {start:'14:00', end:'18:00'}]  // Sat
  ];
  saveData();
  renderSchedule();
  renderToday();
}

function clearAllSlots() {
  if (!confirm('すべての勉強枠を消しますか？')) return;
  schedule = Array.from({length:7}, () => []);
  saveData();
  renderSchedule();
  renderToday();
}

/* ===== Today / Plan generation ===== */
function getHoursForDate(date) {
  return getDayHours(date.getDay());
}

function getStartTimeForDate(date) {
  const slots = schedule[date.getDay()];
  if (!slots.length) return '17:00';
  return slots[0].start;
}

function generatePlan() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const active = tasks.filter(t => t.completed < t.total);
  if (!active.length) return { days: [], warnings: [], totalHours: 0, availableHours: 0, horizon: 0 };

  const horizon = Math.min(90, Math.max(...active.map(t =>
    Math.ceil((new Date(t.deadline + 'T23:59:00') - today) / 86400000)
  )) + 1);

  let days = [];
  for (let k = 0; k < horizon; k++) {
    let date = new Date(today);
    date.setDate(today.getDate() + k);
    let h = getHoursForDate(date);
    days.push({
      date,
      h,
      start: getStartTimeForDate(date),
      items: []
    });
  }

  const warnings = [];
  active.forEach(t => {
    const last = Math.floor((new Date(t.deadline + 'T23:59:00') - today) / 86400000);
    if (last < 0) {
      warnings.push(`${t.name}：締め切りを過ぎています。`);
      return;
    }
    const available = days.slice(0, last + 1).filter(d => d.h > 0);
    if (!available.length) {
      warnings.push(`${t.name}：締め切りまでに勉強できる日がありません。`);
      return;
    }
    const units = t.total - t.completed;
    const totalMinutes = units * t.minutes;
    // 各日の勉強可能時間に比例して配分 → 負担率（勉強時間/空き時間）を揃える
    const weights = available.map(d => Math.max(d.h, 0.01));
    const sumW = weights.reduce((a,b) => a+b, 0);
    let assigned = 0;
    available.forEach((d, i) => {
      let mins = i === available.length - 1
        ? totalMinutes - assigned
        : Math.round(totalMinutes * weights[i] / sumW);
      assigned += mins;
      d.items.push({
        taskId: t.id,
        name: t.name,
        minutes: mins,
        units: Math.max(0, Math.round(mins / t.minutes)),
        unit: t.unit,
        priority: t.priority
      });
    });
  });

  // scale down if over capacity
  days.forEach(d => {
    const total = d.items.reduce((s,x) => s + x.minutes, 0);
    const cap = d.h * 60;
    if (total > cap && cap > 0) {
      d.items.forEach(x => {
        x.minutes = Math.floor(x.minutes * cap / total);
        const t = active.find(tt => tt.id === x.taskId);
        x.units = Math.floor(x.minutes / (t?.minutes || 1));
      });
    }
  });

  const totalHours = active.reduce((s,t) => s + (t.total - t.completed) * t.minutes / 60, 0);
  const availableHours = days.reduce((s,d) => s + d.h, 0);
  if (totalHours > availableHours + 0.1) {
    warnings.push(`必要な勉強時間は約${totalHours.toFixed(1)}時間、設定した期間内の勉強可能時間は約${availableHours.toFixed(1)}時間です。期限までに終わらない可能性があります。`);
  }

  return { days, warnings, totalHours, availableHours, horizon };
}

function slotLabel(day, index) {
  const base = (day.start || '17:00').split(':').map(Number);
  let mins = base[0] * 60 + base[1] + day.items.slice(0, index).reduce((s,x) => s + x.minutes, 0);
  const end = mins + day.items[index].minutes;
  const fmt = n => String(Math.floor(n/60)%24).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');
  return fmt(mins) + '〜' + fmt(end);
}

function renderToday() {
  const content = $('todayContent');
  const active = tasks.filter(t => t.completed < t.total);

  if (!tasks.length) {
    content.innerHTML = `
      <div class="empty-card">
        <h3>目標は、まだありません</h3>
        <p>期限と量を入れると、今日やる分を逆算します。</p>
        <button class="btn btn-primary" onclick="switchTab('goals'); openGoalModal()">目標を追加</button>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <small>今日の空き</small>
          <b>${getHoursForDate(new Date()) > 0 ? getHoursForDate(new Date()).toFixed(1) + 'h' : '未設定'}</b>
        </div>
        <div class="stat-box">
          <small>残っている目標</small>
          <b>0</b>
        </div>
      </div>`;
    return;
  }

  if (!active.length) {
    content.innerHTML = `
      <div class="empty-card">
        <h3>すべて完了しています！</h3>
        <p>新しい目標を追加するか、既存の目標を編集してください。</p>
      </div>`;
    return;
  }

  const plan = generatePlan();
  const todayPlan = plan.days[0] || { items: [], h: 0, date: new Date() };

  let html = '';

  if (plan.warnings.length) {
    html += plan.warnings.map(w => `<div class="notice">⚠ ${esc(w)}</div>`).join('');
  }

  // Today block
  html += `<div class="day-block">`;
  html += `<div class="day-head"><b>今日</b><span>${(todayPlan.items.reduce((s,x)=>s+x.minutes,0)/60).toFixed(1)}h / 空き ${todayPlan.h.toFixed(1)}h</span></div>`;

  if (!todayPlan.items.length) {
    html += `<div class="plan-empty">${todayPlan.h > 0 ? '今日の割り当てはありません' : '今日は勉強枠が設定されていません'}</div>`;
  } else {
    html += todayPlan.items.map((x, i) => {
      const t = tasks.find(tt => String(tt.id) === String(x.taskId));
      const start = t ? (t.completed + 1) : 1;
      const end = start + x.units - 1;
      const rangeLabel = x.units > 0 ? `${start}〜${end}${esc(x.unit)}` : `0${esc(x.unit)}`;
      return `
      <div class="plan-item" id="plan-${x.taskId}">
        <div class="top">
          <input type="checkbox" onchange="completeItem(this, '${x.taskId}', ${x.units})" aria-label="予定どおり完了">
          <div class="text">
            <strong>${esc(x.name)}</strong>
            <small style="display:block;margin-top:4px;font-size:14px;color:var(--ink);font-weight:500">${rangeLabel}</small>
            <small>${slotLabel(todayPlan, i)} · 目安 ${(x.minutes/60).toFixed(1)}時間 · 今日 ${x.units}${esc(x.unit)}</small>
          </div>
        </div>
        <div class="progress-row">
          <input type="number" min="0" step="1" inputmode="numeric" placeholder="${x.units}" id="prog-${x.taskId}" aria-label="今日やった量">
          <span class="unit-label">${esc(x.unit)}</span>
          <button class="btn-record" onclick="recordProgress('${x.taskId}')">記録</button>
        </div>
      </div>`;
    }).join('');
  }
  html += `</div>`;

  // Stats
  html += `
    <div class="stats-row">
      <div class="stat-box">
        <small>今日の空き</small>
        <b>${todayPlan.h > 0 ? todayPlan.h.toFixed(1) + 'h' : '未設定'}</b>
      </div>
      <div class="stat-box">
        <small>残っている目標</small>
        <b>${active.length}</b>
      </div>
    </div>
    <div class="stats-row" style="margin-top:12px">
      <div class="stat-box">
        <small>残り総時間</small>
        <b>${plan.totalHours.toFixed(1)}h</b>
      </div>
      <div class="stat-box">
        <small>計画期間</small>
        <b>${plan.horizon}日</b>
      </div>
    </div>`;

  // Upcoming days (next 6 days)
  const upcoming = plan.days.slice(1, 7);
  if (upcoming.some(d => d.items.length)) {
    html += `<div style="margin-top:28px; margin-bottom:10px; font-size:13px; color:var(--muted)">これから数日</div>`;
    upcoming.forEach(d => {
      if (!d.items.length && d.h === 0) return;
      const label = `${d.date.getMonth()+1}/${d.date.getDate()}（${'日月火水木金土'[d.date.getDay()]}）`;
      const sum = d.items.reduce((s,x) => s + x.minutes, 0);
      html += `<div class="day-block">
        <div class="day-head"><b>${label}</b><span>${(sum/60).toFixed(1)}h / 空き ${d.h.toFixed(1)}h</span></div>
        ${d.items.length
          ? d.items.map((x,i) => `
            <div class="plan-item">
              <div class="text" style="margin-left:0">
                <strong>${esc(x.name)}</strong>
                <small style="display:block;margin-top:3px;color:var(--ink)">${x.units}${esc(x.unit)}</small>
                <small>${slotLabel(d,i)} · 目安 ${(x.minutes/60).toFixed(1)}時間</small>
              </div>
            </div>`).join('')
          : `<div class="plan-empty">休息日・予備日</div>`}
      </div>`;
    });
  }

  content.innerHTML = html;
}

function completeItem(box, id, units) {
  if (!box.checked) return;
  const t = tasks.find(t => String(t.id) === String(id));
  if (t) {
    t.completed = Math.min(t.total, t.completed + units);
    saveData();
    const item = document.getElementById('plan-' + id);
    if (item) item.classList.add('done');
    box.disabled = true;
    setTimeout(() => {
      renderGoals();
      renderToday();
    }, 350);
  }
}

function recordProgress(id) {
  const input = document.getElementById('prog-' + id);
  if (!input) return;
  const amount = Number(input.value);
  if (!amount || amount <= 0) {
    alert('終わった量を入力してください。');
    return;
  }
  const t = tasks.find(t => String(t.id) === String(id));
  if (!t) return;
  t.completed = Math.min(t.total, t.completed + amount);
  saveData();
  input.value = '';
  // 軽いフィードバック
  const item = document.getElementById('plan-' + id);
  if (item) {
    item.style.opacity = '0.6';
  }
  setTimeout(() => {
    renderGoals();
    renderToday();
  }, 300);
}

/* ===== Storage ===== */
function saveData() {
  const data = { tasks, schedule };
  localStorage.setItem('studyflow-v2', JSON.stringify(data));
}

function loadData() {
  try {
    const raw = localStorage.getItem('studyflow-v2');
    if (!raw) return;
    const d = JSON.parse(raw);
    tasks = d.tasks || [];
    if (d.schedule && Array.isArray(d.schedule) && d.schedule.length === 7) {
      schedule = d.schedule;
    }
  } catch(e) {}
}

function confirmReset() {
  if (confirm('すべての目標と予定を削除してリセットしますか？')) {
    localStorage.removeItem('studyflow-v2');
    tasks = [];
    schedule = Array.from({length:7}, () => []);
    renderGoals();
    renderSchedule();
    renderToday();
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}

// close modal on overlay click
$('goalModal').addEventListener('click', e => {
  if (e.target === $('goalModal')) closeGoalModal();
});

init();
</script>
